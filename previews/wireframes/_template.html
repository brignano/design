<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wireframe: name of the change</title>
<!-- Copy to previews/wireframes/<slug>.html. The rule: "Wireframes before build" in brignano/ai-tools fleet/README.md. -->
<link rel="stylesheet" href="../_fonts.css">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
<style>
  /* Wireframe chrome: the two frames and the notes beside them. */
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.55; }
  .wf-head { max-width: 72ch; margin: 0 0 24px; }
  .wf-head h1 { font-size: var(--text-xl); margin: 0 0 4px; }
  .wf-head p { margin: 0 0 8px; color: var(--ink-soft); }
  .wf-frames { display: flex; gap: 24px; align-items: flex-start; overflow-x: auto; padding-bottom: 8px; }
  .wf-frame { flex: none; }
  .wf-label { font-family: var(--mono); font-size: var(--text-xs); color: var(--slate); margin: 0 0 6px; }
  .wf-screen {
    container-type: inline-size; background: var(--card); color: var(--ink);
    border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden;
  }
  .wf-phone .wf-screen { width: 390px; min-height: 844px; }
  .wf-desktop .wf-screen { width: 1280px; min-height: 800px; }

  /* A placeholder for a picture, chart or anything not built yet. Never use
     it for a control components.css already has. */
  .wf-box {
    display: grid; place-items: center; min-height: 120px; padding: 12px;
    border: 1px dashed var(--line-control); border-radius: var(--radius);
    color: var(--slate); font-family: var(--mono); font-size: var(--text-xs); text-align: center;
  }

  /* ── The page being wireframed. Use @container, not @media. ── */
  .page { display: grid; gap: 16px; padding: 16px; }
  .page header { display: flex; justify-content: space-between; align-items: center; }
  @container (min-width: 900px) {
    .page { grid-template-columns: 1fr 2fr; padding: 32px; gap: 32px; }
    .page header { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
  <div class="wf-head">
    <h1>Wireframe: name of the change</h1>
    <p>What the person sees and does, in two sentences. Link the issue or proposal.</p>
    <p>Rejected: the other layout considered, and why, one line each.</p>
  </div>

  <div class="wf-frames">
    <div class="wf-frame wf-phone"><p class="wf-label">Phone · 390px</p><div class="wf-screen"></div></div>
    <div class="wf-frame wf-desktop"><p class="wf-label">Desktop · 1280px</p><div class="wf-screen"></div></div>
  </div>

  <!-- Write the page once, here. The script below puts a copy in each frame. -->
  <template id="wf-page">
    <div class="page">
      <header>
        <strong>Product</strong>
        <button class="btn" type="button">Menu</button>
      </header>
      <div class="wf-box">Sidebar or filters</div>
      <main>
        <h2>Real heading, written to DESIGN.md §15</h2>
        <p>Real copy and demo data, never lorem ipsum.</p>
        <div class="wf-box">Chart, picture or anything not built yet</div>
        <p><button class="btn btn-primary" type="button">Primary action</button></p>
      </main>
    </div>
  </template>

  <script>
    const page = document.getElementById('wf-page');
    for (const screen of document.querySelectorAll('.wf-screen')) screen.append(page.content.cloneNode(true));
  </script>
</body>
</html>
