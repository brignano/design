name: Release

# Publishes to npm when a v* tag is pushed. The tag is the trigger and the
# source of truth for the version — see the guard step below.
#
#   npm version minor && git push --follow-tags
#
# Auth is npm trusted publishing (OIDC). There is no NPM_TOKEN and there
# should never be one: the runner exchanges its OIDC identity for a
# short-lived credential, which also produces the provenance attestation.
# This requires a Trusted Publisher configured on npmjs.com for the package,
# pointing at this repo and this workflow filename.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC exchange and provenance
    steps:
      - uses: actions/checkout@v6

      # Deliberately no registry-url. It makes setup-node write an
      # `_authToken=${NODE_AUTH_TOKEN}` line into .npmrc, which expands to
      # empty when no token exists; npm reads that as "auth is configured",
      # skips the OIDC exchange entirely, and fails ENEEDAUTH. The default
      # registry is registry.npmjs.org regardless.
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Trusted publishing needs npm >= 11.5.1, which is newer than the npm
      # bundled with Node 24.
      - name: Use an npm that speaks OIDC
        run: |
          npm install -g npm@latest
          npm --version

      # A tag that disagrees with package.json publishes a version nobody can
      # find by tag. npm versions are immutable, so catch it before publish.
      - name: Tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v${tag} does not match package.json version ${pkg}"
            exit 1
          fi
          echo "publishing ${pkg}"

      # No install step: the package is CSS and markdown, with no dependencies
      # and no build. --access comes from publishConfig; provenance is implicit
      # under trusted publishing.
      - name: Publish
        run: npm publish
