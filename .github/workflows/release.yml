# Cuts a release: tags main, creates the GitHub release from releases/v<version>.md,
# and publishes to npm via publish.yml.
#
# Run it from the Actions tab (or `gh workflow run release.yml -f version=0.7.0`).
# An npm version can never be reused, so run it only when the notes are merged
# and you mean it.
#
# publish.yml is dispatched rather than relying on its tag trigger: events
# caused by the workflow GITHUB_TOKEN do not start other workflows, so the tag
# created here would never publish. Dispatching publish.yml also keeps the npm
# trusted publisher pointing at publish.yml, unchanged.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 0.7.0 or 0.8.0-rc.1 (no leading v)
        required: true
        type: string
      prerelease:
        description: Mark as pre-release (publishes to the `next` npm tag)
        required: false
        default: false
        type: boolean

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Check the version and notes
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'$VERSION' is not a version like 1.2.3"; exit 1; }
          [[ -s "releases/v$VERSION.md" ]] || { echo "::error::releases/v$VERSION.md is missing or empty on main"; exit 1; }
          if gh release view "v$VERSION" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION already exists"; exit 1
          fi
          if npm view "@brignano/design@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$VERSION is already on npm"; exit 1
          fi
      - name: Create the release
        run: |
          flags=()
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
          gh release create "v$VERSION" --target "$(git rev-parse HEAD)" --title "v$VERSION" \
            --notes-file "releases/v$VERSION.md" "${flags[@]}"
      - name: Publish to npm
        run: |
          gh workflow run publish.yml --ref "v$VERSION" -f tag="v$VERSION" -f prerelease="$PRERELEASE"
          echo "Release v$VERSION created; publish.yml dispatched. Watch the Publish run." >> "$GITHUB_STEP_SUMMARY"
